# This module publishes to a public mirror, so it is one of the modules
# `publish-validate` checks with `GOWORK=off go mod tidy -diff` — a fresh
# checkout of the mirror has no workspace to fall back on, so its go.mod and
# go.sum have to stand alone. `go work sync` rewrites requirements across
# every workspace module, but `generate` only re-tidies modules that own a
# tidy task, so without this file the drift accumulated silently and surfaced
# a whole CI cycle later at publish-validate (runs 1110, 1111).
[[task]]
  id = "tidy"
  type = "short"
  cmd = "go mod tidy -e"

[[task]]
  id = "generate"
  type = "short"
  dependencies = ["tidy"]

# The README is pictures: VHS tapes in screenshots/, each recorded against
# the throwaway HOME screenshots/setup.bash builds. Kept out of generate:
# recording needs ttyd, ffmpeg, and a browser, and a GIF never renders
# byte-identically twice, so check-for-diff could never pass over it.
#
# The tapes source setup.bash hidden, where its errors don't show and VHS
# reports only a timeout, so it runs once here first, in the open.
[[task]]
  id = "screenshots"
  type = "short"
  cmd = """
    set -euo pipefail
    bash -c 'source screenshots/setup.bash'
    for tape in screenshots/*.tape; do
      go run github.com/charmbracelet/vhs@v0.12.1 "$tape"
    done
  """
